<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405" role="img" aria-labelledby="title"><title id="title">Point positions and movement directions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="20" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><line x1="80" y1="150" x2="800" y2="150" stroke="#244f69" stroke-width="6"/><path d="M340 150 Q420 150 510 225 L800 315" fill="none" stroke="#244f69" stroke-width="6"/><text x="70" y="135" font-size="20" text-anchor="middle">A</text><text x="820" y="135" font-size="20" text-anchor="middle">B</text><text x="820" y="305" font-size="20" text-anchor="middle">C</text><text x="610" y="125" font-size="18" text-anchor="middle">Normal path in this example</text><text x="620" y="350" font-size="18" text-anchor="middle">Reverse path</text><line x1="100" y1="60" x2="310" y2="60" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="40" font-size="19" text-anchor="middle">Facing direction</text><line x1="770" y1="205" x2="560" y2="205" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><text x="670" y="235" font-size="19" text-anchor="middle">Trailing direction</text><text x="235" y="190" font-size="18" text-anchor="middle">Toe / divergence</text><text x="450" y="375" font-size="19" text-anchor="middle">Normal and reverse are designated on the plan.</text></g></svg>