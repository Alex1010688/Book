<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img" aria-labelledby="title"><title id="title">A complete double-cut repeater circuit path</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><text x="450" y="30" font-size="22" text-anchor="middle">Trace the feed, both controlling contacts and the return</text><rect x="15" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="75.0" y="114.5" font-size="18" text-anchor="middle">B50</text><text x="75.0" y="139.5" font-size="18" text-anchor="middle">feed</text><line x1="140" y1="120" x2="160" y2="120" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="225.0" y="127.0" font-size="18" text-anchor="middle">Fuse</text><line x1="290" y1="120" x2="310" y2="120" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="375.0" y="114.5" font-size="18" text-anchor="middle">AE TR</text><text x="375.0" y="139.5" font-size="18" text-anchor="middle">front contact</text><line x1="440" y1="120" x2="460" y2="120" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="525.0" y="114.5" font-size="18" text-anchor="middle">AE TPR</text><text x="525.0" y="139.5" font-size="18" text-anchor="middle">coil</text><line x1="590" y1="120" x2="610" y2="120" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="675.0" y="114.5" font-size="18" text-anchor="middle">AE TR</text><text x="675.0" y="139.5" font-size="18" text-anchor="middle">front contact</text><line x1="740" y1="120" x2="760" y2="120" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="80" width="120" height="80" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="825.0" y="114.5" font-size="18" text-anchor="middle">N50</text><text x="825.0" y="139.5" font-size="18" text-anchor="middle">return</text><text x="450" y="205" font-size="19" text-anchor="middle">The coil needs a complete path through both contacts.</text></g></svg>