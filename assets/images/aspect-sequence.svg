<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title"><title id="title">Four-aspect warning progression towards a stop signal</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="20" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><text x="450" y="35" font-size="19" text-anchor="middle">Direction of travel</text><line x1="180" y1="55" x2="720" y2="55" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="95" width="70" height="130" rx="18" fill="#202b32"/><circle cx="120" cy="160" r="18" fill="#19834a" stroke="white" stroke-width="1.5"/><line x1="120" y1="228" x2="120" y2="265" stroke="#244f69" stroke-width="3"/><text x="120" y="300" font-size="19" text-anchor="middle">Green</text><rect x="305" y="95" width="70" height="130" rx="18" fill="#202b32"/><circle cx="340" cy="130" r="18" fill="#e6ac13" stroke="white" stroke-width="1.5"/><circle cx="340" cy="190" r="18" fill="#e6ac13" stroke="white" stroke-width="1.5"/><line x1="340" y1="228" x2="340" y2="265" stroke="#244f69" stroke-width="3"/><text x="340" y="300" font-size="19" text-anchor="middle">Double yellow</text><rect x="525" y="95" width="70" height="130" rx="18" fill="#202b32"/><circle cx="560" cy="160" r="18" fill="#e6ac13" stroke="white" stroke-width="1.5"/><line x1="560" y1="228" x2="560" y2="265" stroke="#244f69" stroke-width="3"/><text x="560" y="300" font-size="19" text-anchor="middle">Single yellow</text><rect x="745" y="95" width="70" height="130" rx="18" fill="#202b32"/><circle cx="780" cy="160" r="18" fill="#b52c35" stroke="white" stroke-width="1.5"/><line x1="780" y1="228" x2="780" y2="265" stroke="#244f69" stroke-width="3"/><text x="780" y="300" font-size="19" text-anchor="middle">Red</text><text x="450" y="345" font-size="18" text-anchor="middle">A simplified sequence towards a stop signal; not a spacing plan.</text></g></svg>