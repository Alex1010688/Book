<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title"><title id="title">Simplified route lifecycle from command to release</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="20" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="35" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="150.0" y="77.0" font-size="20" text-anchor="middle">Route command</text><line x1="280" y1="70" x2="320" y2="70" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="35" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="450.0" y="77.0" font-size="20" text-anchor="middle">Availability checked</text><line x1="580" y1="70" x2="620" y2="70" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="625" y="35" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="750.0" y="77.0" font-size="20" text-anchor="middle">Points called</text><path d="M775 110 V135 H150 V165" fill="none" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="170" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="150.0" y="212.0" font-size="20" text-anchor="middle">Route protected</text><line x1="280" y1="205" x2="320" y2="205" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="170" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="450.0" y="212.0" font-size="20" text-anchor="middle">Conditions satisfied</text><line x1="580" y1="205" x2="620" y2="205" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="625" y="170" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="750.0" y="212.0" font-size="20" text-anchor="middle">Signal may clear</text><path d="M775 245 V270 H150 V300" fill="none" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="305" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="150.0" y="347.0" font-size="20" text-anchor="middle">Train passage</text><line x1="280" y1="340" x2="320" y2="340" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="305" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="450.0" y="347.0" font-size="20" text-anchor="middle">Valid cancellation</text><line x1="580" y1="340" x2="620" y2="340" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="625" y="305" width="250" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="750.0" y="347.0" font-size="20" text-anchor="middle">Locking releases</text><text x="450" y="440" font-size="17" text-anchor="middle">Cancellation and release are distinct; locking can remain after cancellation.</text></g></svg>