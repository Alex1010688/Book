<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="title"><title id="title">Continuity and insulation concern different electrical paths</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><text x="450" y="30" font-size="22" text-anchor="middle">Intended and unintended electrical paths</text><text x="80" y="110" font-size="18" text-anchor="middle">Core 1</text><text x="80" y="210" font-size="18" text-anchor="middle">Core 2</text><line x1="135" y1="105" x2="800" y2="105" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><line x1="135" y1="205" x2="800" y2="205" stroke="#244f69" stroke-width="3"/><text x="460" y="85" font-size="19" text-anchor="middle">Continuity follows the intended conductor</text><line x1="430" y1="115" x2="430" y2="195" stroke="#9b3944" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="560" y="160" font-size="18" text-anchor="middle">Core-to-core leakage</text><line x1="700" y1="215" x2="700" y2="295" stroke="#9b3944" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="575" y="270" font-size="18" text-anchor="middle">Core-to-earth leakage</text><line x1="660" y1="305" x2="740" y2="305" stroke="#244f69" stroke-width="3"/><line x1="670" y1="315" x2="730" y2="315" stroke="#244f69" stroke-width="3"/><line x1="685" y1="325" x2="715" y2="325" stroke="#244f69" stroke-width="3"/><text x="450" y="365" font-size="18" text-anchor="middle">Good continuity can coexist with poor insulation or incorrect identity.</text></g></svg>