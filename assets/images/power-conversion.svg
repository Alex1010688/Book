<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="title"><title id="title">Transformer and rectifier supply functions and illustrative waveforms</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><text x="450" y="30" font-size="22" text-anchor="middle">Separate stages in a d.c. supply</text><rect x="35" y="70" width="230" height="85" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="150.0" y="107.0" font-size="18" text-anchor="middle">Transformer</text><text x="150.0" y="132.0" font-size="18" text-anchor="middle">voltage / isolation</text><line x1="272" y1="112" x2="327" y2="112" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="335" y="70" width="230" height="85" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="450.0" y="107.0" font-size="18" text-anchor="middle">Rectifier</text><text x="450.0" y="132.0" font-size="18" text-anchor="middle">unidirectional output</text><line x1="572" y1="112" x2="627" y2="112" stroke="#244f69" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="70" width="230" height="85" rx="7" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="750.0" y="107.0" font-size="18" text-anchor="middle">Smoothing / regulation</text><text x="750.0" y="132.0" font-size="18" text-anchor="middle">where provided</text><text x="150" y="200" font-size="20" text-anchor="middle">a.c.</text><text x="450" y="200" font-size="20" text-anchor="middle">Pulsating d.c.</text><text x="750" y="200" font-size="20" text-anchor="middle">Conditioned d.c.</text><line x1="70" y1="275" x2="230" y2="275" stroke="#b6c3cc" stroke-width="1"/><line x1="370" y1="275" x2="530" y2="275" stroke="#b6c3cc" stroke-width="1"/><line x1="670" y1="275" x2="830" y2="275" stroke="#b6c3cc" stroke-width="1"/><path d="M70 275 Q90 195 110 275 Q130 355 150 275 Q170 195 190 275 Q210 355 230 275" fill="none" stroke="#244f69" stroke-width="3"/><path d="M370 275 Q390 195 410 275 Q430 195 450 275 Q470 195 490 275 Q510 195 530 275" fill="none" stroke="#244f69" stroke-width="3"/><line x1="670" y1="235" x2="830" y2="235" stroke="#244f69" stroke-width="3"/><text x="450" y="345" font-size="17" text-anchor="middle">Waveforms illustrate functions; they do not specify output values or ripple limits.</text></g></svg>