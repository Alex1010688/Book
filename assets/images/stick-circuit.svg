<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title"><title id="title">Start and holding paths with a common release in a conceptual relay circuit</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#244f69"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="20" fill="#17394f" stroke-linecap="round" stroke-linejoin="round"><text x="65" y="170" font-size="18" text-anchor="middle">Feed</text><text x="835" y="170" font-size="18" text-anchor="middle">Return</text><line x1="100" y1="160" x2="180" y2="160" stroke="#244f69" stroke-width="3"/><line x1="180" y1="160" x2="210" y2="160" stroke="#244f69" stroke-width="3"/><line x1="210" y1="160" x2="240" y2="140" stroke="#244f69" stroke-width="3"/><line x1="250" y1="160" x2="300" y2="160" stroke="#244f69" stroke-width="3"/><text x="210" y="115" font-size="18" text-anchor="middle">Release</text><text x="210" y="215" font-size="16" text-anchor="middle">Closed to permit</text><line x1="300" y1="160" x2="300" y2="85" stroke="#244f69" stroke-width="3"/><line x1="300" y1="85" x2="380" y2="85" stroke="#244f69" stroke-width="3"/><line x1="380" y1="85" x2="420" y2="65" stroke="#244f69" stroke-width="3"/><line x1="430" y1="85" x2="570" y2="85" stroke="#244f69" stroke-width="3"/><line x1="570" y1="85" x2="570" y2="160" stroke="#244f69" stroke-width="3"/><text x="440" y="40" font-size="18" text-anchor="middle">Start button</text><line x1="300" y1="160" x2="300" y2="275" stroke="#244f69" stroke-width="3"/><line x1="300" y1="275" x2="380" y2="275" stroke="#244f69" stroke-width="3"/><line x1="380" y1="275" x2="420" y2="255" stroke="#244f69" stroke-width="3"/><line x1="430" y1="275" x2="570" y2="275" stroke="#244f69" stroke-width="3"/><line x1="570" y1="275" x2="570" y2="160" stroke="#244f69" stroke-width="3"/><text x="440" y="320" font-size="18" text-anchor="middle">R front contact</text><text x="440" y="345" font-size="16" text-anchor="middle">Closes when R picks up</text><line x1="570" y1="160" x2="650" y2="160" stroke="#244f69" stroke-width="3"/><rect x="650" y="125" width="90" height="70" rx="8" fill="#edf4f7" stroke="#244f69" stroke-width="2"/><text x="695.0" y="167.0" font-size="20" text-anchor="middle">R coil</text><line x1="740" y1="160" x2="795" y2="160" stroke="#244f69" stroke-width="3"/><text x="450" y="400" font-size="19" text-anchor="middle">Release controls both the starting path and the holding path.</text></g></svg>