project:
  type: book
  output-dir: _book
  render:
    - index.qmd
    - chapters/*.qmd
  resources:
    - assets/images/*.svg
    - assets/icons/*.svg

filters:
  - filters/local-information.lua
  - filters/background.lua

local-information:
  title: "Local information"
  border-colour: "#b65e00"
  header-colour: "#fff0dd"

background:
  border-colour: "#70558c"
  header-colour: "#f3eef8"

lang: en-GB
book:
  title: "Railway Signalling for Technicians"
  subtitle: "An introduction to principles, equipment and systems"
  author: "Alex Corcoran"
  output-file: railway-signalling-for-technicians
  search: true
  chapters:
    - index.qmd
    - chapters/introduction.qmd
    - chapters/railway-basics.qmd
    - chapters/railway-signalling.qmd
    - chapters/overview.qmd
    - chapters/trackwork.qmd
    - chapters/points.qmd
    - chapters/lineside-signals.qmd
    - chapters/circuit-reading.qmd
    - chapters/relays.qmd
    - chapters/train-detection.qmd
    - chapters/interlocking.qmd
    - chapters/ssi.qmd
    - chapters/remote-control-systems.qmd
    - chapters/telecommunications.qmd
    - chapters/power-supplies.qmd
    - chapters/cables.qmd
    - chapters/useful-sources-of-information.qmd
  appendices:
    - chapters/glossary.qmd

number-depth: 2
format:
  html:
    theme:
      - cosmo
      - assets/styles/custom.scss
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    fig-cap-location: bottom
  typst:
    toc: true
    toc-depth: 2
    papersize: a4
    fontsize: 11pt
    margin:
      top: 22mm
      bottom: 22mm
      left: 24mm
      right: 22mm
    fig-cap-location: bottom
